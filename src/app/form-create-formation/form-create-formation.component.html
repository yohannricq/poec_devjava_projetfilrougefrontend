<div id="alert-container"></div>
<form [formGroup]="monFormulaire" (ngSubmit)="onSubmit()">
    <div class="mb-3">
      <label for="nom" class="form-label">Nom :</label>&nbsp;
      <input type="text" id="nom" formControlName="nom" class="form-control">
    </div>
    <div class="mb-3">
        <label for="lieu" class="form-label">Lieu :</label>&nbsp;
        <input type="text" id="lieu" formControlName="lieu" class="form-control">
    </div>
    <div class="mb-3">
        <label for="detail" class="form-label">Détail :</label>&nbsp;
        <input type="text" id="detail" formControlName="detail" class="form-control">
    </div>
    <div class="mb-3">
        <label for="description" class="form-label">Description :</label>&nbsp;
        <input type="text" id="description" formControlName="description" class="form-control">
    </div>
    <div class="mb-3">
        <label for="theme" class="form-label">Choix du theme</label>
        <select [(ngModel)]="themeSelected" formControlName="theme" id="theme" class="form-control">
            <option *ngFor="let theme of themes" [ngValue]="theme">{{ theme.nom }}</option>
        </select>
    </div>
    <div class="mb-3">
        <label for="prixHt" class="form-label">Prix hors taxe :</label>&nbsp;
        <input type="number" id="prixHt" formControlName="prixHt" class="form-control">
    </div>
    <div class="mb-3">
        <label for="duree" class="form-label">Durée :</label>&nbsp;
        <input type="number" id="duree" formControlName="duree" class="form-control">
    </div>
    <br/>
    <button type="submit" [disabled]="monFormulaire.invalid" class="btn btn-primary">Create</button>
  </form>
  <br/>
